{{- /* chezmoi:modify-template */ -}}
{{- /* Codex owns local trust, plugins, and runtime state. Merge the shared
      settings over them, own the Executor server outright, and keep the
      original text when nothing changes to avoid formatting churn. */ -}}
{{- $current := .chezmoi.stdin | fromToml -}}
{{- $merged := mustMergeOverwrite (deepCopy $current) (includeTemplate "codex-config.toml.tmpl" . | fromToml) -}}
{{- /* Share the working OAuth store and refresh path with the other agents,
      instead of maintaining a second Codex-only HTTP login. Require Executor
      to finish loading so a failed connection cannot silently omit its tools.
      Manual: on each host, run `executor-mcp --login`; see that wrapper for
      the remote callback setup. Service actions still use code mode. */ -}}
{{- $servers := get $merged "mcp_servers" | default dict -}}
{{- $_ := set $servers "executor" (dict "command" (joinPath .chezmoi.homeDir ".local/bin/executor-mcp") "args" (list) "startup_timeout_sec" 30 "required" true "disabled_tools" (list "call")) -}}
{{- $_ := set $merged "mcp_servers" $servers -}}
{{- /* Account plugins take their on/off state from the ChatGPT account, so hide
      their apps locally, reading the app IDs from the installed plugins: the
      managed Executor server replaces the account connector, as in Claude
      Code, and Google integrations stay off. */ -}}
{{- $apps := get $merged "apps" | default dict -}}
{{- range $plugin := list "executor" "google-drive" -}}
{{-   range glob (joinPath $.chezmoi.homeDir ".codex/plugins/cache/openai-curated-remote" $plugin "*/.app.json") -}}
{{-     range $app := (include . | fromJson).apps -}}
{{-       $_ := set $apps $app.id (mustMergeOverwrite (get $apps $app.id | default dict) (dict "enabled" false)) -}}
{{-     end -}}
{{-   end -}}
{{- end -}}
{{- if $apps -}}
{{-   $_ := set $merged "apps" $apps -}}
{{- end -}}
{{- if eq ($current | toJson) ($merged | toJson) -}}
{{- .chezmoi.stdin -}}
{{- else -}}
{{ $merged | toToml }}
{{- end -}}
