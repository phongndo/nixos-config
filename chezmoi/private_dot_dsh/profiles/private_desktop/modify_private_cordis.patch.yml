#!/bin/sh
# DeepSeek Harness writes its own settings into this patch list. Own only the
# Executor entry: drop any earlier copy of it (and an empty `[]`), keep every
# other entry as the app wrote it, and append the current one. dsh scrubs the
# environment of stdio servers, so pass HOME through for mise and Executor.
# Home Manager activation runs this with a bare PATH; only macOS has the app,
# so use its system tools.
set -eu
PATH=/usr/bin:/bin
awk '
  /^- / { skip = ($0 == "- id: mcp-executor") }
  /^\[\][[:space:]]*$/ { next }
  !skip { print }
'
cat <<YAML
- id: mcp-executor
  name: "@deepseek-ai/dsh-mcp-client"
  config:
    serverName: executor
    transport: stdio
    command: $HOME/.local/share/mise/shims/executor
    args: [mcp]
    env:
      HOME: $HOME
    startupTimeoutMs: 30000
YAML
